<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #47b3e9;
        font-family: "Segoe UI", sans-serif;
        outline: none;
        user-select: none;
      }

      #titlebar {
        height: 32px;
        background: #47b3e9;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
        -webkit-app-region: drag;
      }

      #title {
        padding-left: 10px;
        font-size: 14px;
        font-weight: bold;
      }

      #buttons {
        display: flex;
        height: 100%;
        -webkit-app-region: no-drag;
      }

      .btn {
        width: 46px;
        height: 32px;
        border: none;
        outline: none;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        -webkit-app-region: no-drag;
      }

      .btn img {
        width: 12px;
        height: 12px;
        object-fit: contain;
        pointer-events: none;
      }

      .btn:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .btn:focus {
        outline: none;
        box-shadow: none;
      }

      #close:hover {
        background: #e81123;
      }
    </style>
  </head>

  <body>
    <div id="titlebar">
      <div id="title">Pandanda.org</div>

      <div id="buttons">
        <button class="btn" id="min">
          <img src="./icons/min.svg" />
        </button>

        <button class="btn" id="max">
          <img src="./icons/max.svg" />
        </button>

        <button class="btn" id="close">
          <img src="./icons/close.svg" />
        </button>
      </div>
    </div>

    <script>
      document.getElementById("min").onclick = () => {
        window.electronAPI.minimize();
      };

      document.getElementById("max").onclick = () => {
        window.electronAPI.maximize();
      };

      document.getElementById("close").onclick = () => {
        window.electronAPI.close();
      };
    </script>
  </body>
</html>
